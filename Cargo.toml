[workspace]
members = [
    "crates/kerf-core",
    "crates/kerf-model",
    "crates/kerf-fx",
    "crates/kerf-compose",
    "crates/kerf-lang",
    "crates/kerf-engine",
    "crates/kerf-playback",
    "crates/kerf-runtime",
    "crates/kerf-qt-bridge",
    "crates/kerf-commands",
    "crates/kerf-cloud",
    "crates/kerf-skills",
    "crates/kerf-fetcher",
    "crates/kerf-interchange",
    "crates/kerf-agent",
    "crates/kerf-mcp",
    "crates/kerf-cli",
    "crates/kerf-draw",
    "effectcraft/crates/*",
    "filmcraft/crates/*",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# The EffectCraft and FilmCraft crates (see their README.md) name their
# dependencies and lints from the workspace; Kerf's own crates name theirs
# directly.
[workspace.dependencies]
effectcraft-time = { path = "effectcraft/crates/time" }
effectcraft-geom = { path = "effectcraft/crates/geom" }
effectcraft-color = { path = "effectcraft/crates/color" }
effectcraft-raster = { path = "effectcraft/crates/raster" }
effectcraft-path = { path = "effectcraft/crates/path" }
effectcraft-keyframe = { path = "effectcraft/crates/keyframe" }
effectcraft-project = { path = "effectcraft/crates/project" }
effectcraft-text = { path = "effectcraft/crates/text" }
effectcraft-effects = { path = "effectcraft/crates/effects" }
effectcraft-segment = { path = "effectcraft/crates/segment" }
effectcraft-track = { path = "effectcraft/crates/track" }
effectcraft-model = { path = "effectcraft/crates/model" }
effectcraft-render = { path = "effectcraft/crates/render" }
effectcraft-gpu = { path = "effectcraft/crates/gpu" }
filmcraft-geom = { path = "filmcraft/crates/geom" }
filmcraft-color = { path = "filmcraft/crates/color" }
filmcraft-text = { path = "filmcraft/crates/text" }
filmcraft-time = { path = "filmcraft/crates/time" }
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
rayon = "1"
web-time = "1"
proptest = "1"
kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
harfrust = { version = "0.12", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = { version = "30.0.1", features = ["fragile-send-sync-non-atomic-wasm"] }
bytemuck = "1"
pollster = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# Extreme runtime profile for the media engine CLI. Thin LTO is almost as
# fast to run and much faster to link; fat LTO is reserved for maxperf.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Whole-program LTO for a local max-speed binary:
#   cargo build --profile maxperf -p kerf-engine
[profile.maxperf]
inherits = "release"
lto = "fat"

# Keep the default dev profile fast. Release-style optimization of every
# dependency made small Rust edits rebuild the entire media stack. Use the
# explicit `maxperf` profile when benchmarking a final binary.
[profile.dev]
opt-level = 0
debug = 1
incremental = true

# EffectCraft's pixel loops stay optimized in debug builds, as EffectCraft
# builds them: effects and previews stay interactive, and the effects' golden
# hashes (pinned from optimized float code) hold.
[profile.dev.package.effectcraft-raster]
opt-level = 3

[profile.dev.package.effectcraft-render]
opt-level = 3

[profile.dev.package.effectcraft-gpu]
opt-level = 3

[profile.dev.package.effectcraft-effects]
opt-level = 3

[profile.dev.package.effectcraft-track]
opt-level = 3

[profile.dev.package.effectcraft-path]
opt-level = 3
