[workspace]
members = [
    # foundation
    "crates/foundation/kerf-model",
    "crates/foundation/kerf-lang",
    "crates/foundation/kerf-geom",
    "crates/foundation/kerf-color",
    "crates/foundation/kerf-text",
    # render
    "crates/render/kerf-raster",
    "crates/render/kerf-draw",
    "crates/render/kerf-gpu",
    "crates/render/kerf-kernel",
    # edit
    "crates/edit/kerf-interchange",
    "crates/edit/kerf-collab",
    # effects
    "crates/effects/kerf-fx",
    "crates/effects/kerf-raster-fx",
    # color
    "crates/color/kerf-scopes",
    # motion
    "crates/motion/kerf-motion",
    # vfx
    "crates/vfx/kerf-segment",
    "crates/vfx/kerf-track",
    # image
    "crates/image/kerf-image",
    # engine
    "crates/engine/kerf-core",
    "crates/engine/kerf-compose",
    "crates/engine/kerf-playback",
    "crates/engine/kerf-engine",
    # surfaces
    "crates/surfaces/kerf-runtime",
    "crates/surfaces/kerf-agent",
    "crates/surfaces/kerf-mcp",
    "crates/surfaces/kerf-skills",
    "crates/surfaces/kerf-commands",
    "crates/surfaces/kerf-cli",
    "crates/surfaces/kerf-qt-bridge",
    "crates/surfaces/kerf-cloud",
    "crates/surfaces/kerf-fetcher",
    # tools
    "tools/kerf-comfy",
    "tools/kerf-guide",
    "tools/kerf-layers",
    "tools/kerf-icon",
]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

# The crates carried from EffectCraft and FilmCraft (kerf-color, kerf-geom,
# kerf-text, kerf-raster, kerf-raster-fx; see licenses/README.md) take these
# and the lints below from the workspace.
[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
rayon = "1"
proptest = "1"
kurbo = "0.13"
linesweeper = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

# Extreme runtime profile for the media engine CLI. Thin LTO is almost as
# fast to run and much faster to link; fat LTO is reserved for maxperf.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwind, not abort: a panic in one editor task or one media file's index is
# caught (kerf-qt-bridge tasks.rs, kerf-runtime kernel.rs) and becomes an
# error, where abort would take the editor or kerfd down with it.
# Keep symbol names, dropping only debug info, so a crash report's backtrace
# (kerf-runtime crash.rs) says which function it was in.
strip = "debuginfo"

# The editor links against the bridge, so leave its symbols in: a stripped
# dylib's string table can land off an 8-byte boundary, which Apple's linker
# refuses ("mis-aligned LINKEDIT string pool").
[profile.release.package.kerf-qt-bridge]
strip = false

# Whole-program LTO for a local max-speed binary:
#   cargo build --profile maxperf -p kerf-engine
[profile.maxperf]
inherits = "release"
lto = "fat"

# Keep the default dev profile fast. Release-style optimization of every
# dependency made small Rust edits rebuild the entire media stack. Use the
# explicit `maxperf` profile when benchmarking a final binary.
[profile.dev]
opt-level = 0
debug = 1
incremental = true

# EffectCraft's pixel loops stay optimized in debug builds, as EffectCraft
# builds them: effects and previews stay interactive, and the effects' golden
# hashes (pinned from optimized float code) hold.
[profile.dev.package.kerf-raster]
opt-level = 3

[profile.dev.package.kerf-raster-fx]
opt-level = 3

# A camera solve is many small bundle adjustments, which take minutes unoptimized.
[profile.dev.package.kerf-track]
opt-level = 3

