[workspace]
members = [
    # foundation
    "crates/foundation/kerf-model",
    "crates/foundation/kerf-paths",
    "crates/foundation/kerf-protocol",
    "crates/foundation/kerf-lang",
    "crates/foundation/kerf-geom",
    "crates/foundation/kerf-color",
    "crates/foundation/kerf-text",
    "crates/foundation/kerf-sidecar",
    "crates/foundation/kerf-secrets",
    "crates/foundation/kerf-generate-api",
    # render
    "crates/render/kerf-raster",
    "crates/render/kerf-draw",
    "crates/render/kerf-gpu",
    "crates/render/kerf-gpu-cl",
    "crates/render/kerf-kernel",
    # edit
    "crates/edit/kerf-interchange",
    "crates/edit/kerf-collab",
    # effects
    "crates/effects/kerf-fx",
    "crates/effects/kerf-raster-fx",
    # color
    "crates/color/kerf-scopes",
    # motion
    "crates/motion/kerf-motion",
    "crates/motion/kerf-sim",
    # vfx
    "crates/vfx/kerf-track",
    # image
    "crates/image/kerf-image",
    # engine
    "crates/engine/kerf-core",
    "crates/engine/kerf-compose",
    "crates/engine/kerf-playback",
    "crates/engine/kerf-engine",
    # surfaces
    "crates/surfaces/kerf-runtime",
    "crates/surfaces/kerf-agent",
    "crates/surfaces/kerf-mcp",
    "crates/surfaces/kerf-skills",
    "crates/surfaces/kerf-commands",
    "crates/surfaces/kerf-cli",
    "crates/surfaces/kerf-bridge",
    "crates/surfaces/kerf-cloud",
    "crates/surfaces/kerf-shots",
    "crates/surfaces/kerf-generate",
    # tools
    "tools/kerf-layers",
    "tools/kerf-icon",
]
# The editor (apps/kerf-editor) is a workspace of its own: its manifest says why.
exclude = ["apps/kerf-editor"]
resolver = "2"

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "MIT"
# Nothing here goes to crates.io: every crate takes `publish.workspace = true`.
publish = false

# Every external dependency two or more crates use, declared once: a crate
# takes it with `x.workspace = true` and names its own features.
[workspace.dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.23"
clap = "4"
ffmpeg-next = { version = "9.0", default-features = false }
hex = "0.4"
kurbo = "0.13"
libc = "0.2"
linesweeper = "0.5"
log = "0.4"
# The allocator of whatever draws frames in its own process: kerf-engine, kerf-mcp and kerf
# here, and the editor, which names it in its own workspace. A frame is made of pictures the
# size of the frame, and the system's allocator gives memory that large back to the system
# as each is dropped, to be handed out new, and paid for a page at a time, for the next: a
# 4K frame with an effect on it took 1.5 to 2.4 times as long under it. kerfd draws nothing
# and keeps the system's.
mimalloc = { version = "0.1", default-features = false }
proptest = "1"
rayon = "1"
# The input schema kerf-mcp shows an agent for each tool, derived from the type
# the tool reads its arguments into: a field, its type and its description are
# said once, where the tool reads them.
schemars = "1"
serde = "1"
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
thiserror = "2"
ureq = "3"
windows-sys = "0.61"

# Every crate takes these with `[lints] workspace = true`. Unsafe code is
# denied, not forbidden, so the few places that need it (calls into the
# operating system and FFmpeg, and a crash handler) expect it on just the
# module or item that holds it, each `unsafe` block saying why it is sound
# (`// SAFETY:`). Clippy runs on its defaults. Where code needs one loosened it
# expects it on that code alone: at the root of what is carried from
# EffectCraft and FilmCraft (licenses/README.md), and on the functions of
# Kerf's own whose many arguments stay separate.
#
# A lint is loosened with `#[expect(lint, reason = "...")]`, not `allow`: an
# expectation warns once the code it excused is gone, where an `allow` stays
# on, silently, and the reason says why. Where the excused code is built only
# on some systems, so is the expectation (`cfg_attr`): unfulfilled, it warns.
# allow_attributes catches an outer `#[allow]` but not an inner `#![allow]`,
# so a module's or crate's own is left to review.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Extreme runtime profile for the media engine CLI. Thin LTO is almost as
# fast to run and much faster to link; fat LTO is reserved for maxperf.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# Unwind, not abort: a panic in one editor task or one media file's index is
# caught (kerf-bridge tasks.rs, kerf-runtime kernel.rs) and becomes an
# error, where abort would take the editor or kerfd down with it.
# Keep symbol names, dropping only debug info, so a crash report's backtrace
# (kerf-runtime crash.rs) says which function it was in.
strip = "debuginfo"

# Whole-program LTO for a local max-speed binary:
#   cargo build --profile maxperf -p kerf-engine
[profile.maxperf]
inherits = "release"
lto = "fat"

# Keep the default dev profile fast. Release-style optimization of every
# dependency made small Rust edits rebuild the entire media stack. Use the
# explicit `maxperf` profile when benchmarking a final binary.
[profile.dev]
opt-level = 0
debug = 1
incremental = true

# EffectCraft's pixel loops stay optimized in debug builds, as EffectCraft
# builds them: effects and previews stay interactive, and the effects' golden
# hashes (pinned from optimized float code) hold.
[profile.dev.package.kerf-raster]
opt-level = 3

[profile.dev.package.kerf-raster-fx]
opt-level = 3

# A camera solve is many small bundle adjustments, which take minutes unoptimized.
[profile.dev.package.kerf-track]
opt-level = 3

