# What cargo-deny holds both workspaces' dependencies to:
#
#   cargo deny check
#   cargo deny --manifest-path apps/kerf-editor/Cargo.toml --workspace check
#
# CI runs both (Rust runtime > deny).

[graph]
# Every feature's dependencies, here and in CI alike.
all-features = true

[advisories]
# A crate with a known vulnerability fails the check wherever it is in the tree, and so
# does one whose release was withdrawn.
yanked = "deny"
# An unmaintained crate, and one found unsound, fail it where a Kerf crate names the
# crate itself. Deeper ones are another crate's to replace (GPUI's, keyring's), and
# `cargo deny check` says nothing of them. These are cargo-deny 0.22's own defaults,
# written out because an older cargo-deny takes "all" for the first.
unmaintained = "workspace"
unsound = "workspace"

[licenses]
# Every license a dependency is under today. Kerf is MIT; these are the
# permissive licenses, and one that asks more of whoever passes the code on:
# MPL-2.0 (a changed file of the crate stays under it).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
    "MPL-2.0",
    "NCSA",
    "WTFPL",
]
confidence-threshold = 0.9
# One file for two workspaces: the repository's own meets fewer of these than the
# editor's, so a license neither meets any more stays here unsaid until it is taken out.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate build twice and no more: said, not refused.
multiple-versions = "warn"
# A dependency on any version at all (`*`) is refused; one crate of a workspace may
# name another by its path alone.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Crates come from crates.io, and from nowhere else.
unknown-registry = "deny"
unknown-git = "deny"
