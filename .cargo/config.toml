# One target folder for the repository's workspace and the editor's
# (apps/kerf-editor, a workspace of its own), so the editor builds to
# target/debug/kerf-editor beside kerfd wherever cargo runs from.
[build]
target-dir = "target"

[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[target.aarch64-apple-darwin]
# The macOS 27 SDK emits arm64e.x1 TAPI entries that older Homebrew LLD
# versions cannot parse. Keep the SDK linker as the final -fuse-ld flag even
# when a user's global Cargo config adds LLD first.
rustflags = ["-C", "link-arg=-fuse-ld=/usr/bin/ld"]
