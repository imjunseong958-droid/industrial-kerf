[package]
name = "kerf-comfy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Asks a ComfyUI server for a shot: a program a recipe's `generate` runs for a model kept there"
publish.workspace = true

[[bin]]
name = "kerf-comfy"
path = "src/main.rs"

[dependencies]
hex.workspace = true
kerf-paths = { path = "../../crates/foundation/kerf-paths" }
# The workflow's file: its blanks, what it makes, and those that come with this program.
kerf-workflow = { path = "../../crates/surfaces/kerf-workflow" }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
sha2.workspace = true
# What the server says while a job runs, which it says over a websocket and nowhere else:
# which step of how many it is on. Asked for beside the HTTP calls, and done without where
# it does not open.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
# The system's certificates, as the editor's update check takes them, so a
# network that inspects TLS with its own CA still reaches the server.
ureq = { workspace = true, features = ["json", "platform-verifier"] }

[target.'cfg(unix)'.dependencies]
# To take a job back from the server when asked to end.
signal-hook.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
