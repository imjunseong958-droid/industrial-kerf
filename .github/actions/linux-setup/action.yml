name: Linux setup
description: What every Linux job builds against, the system libraries and the pinned FFmpeg.
runs:
  using: composite
  steps:
    # libclang for ffmpeg-sys-next's bindgen; ALSA for playback's audio
    # output (cpal); Qt with its private GUI headers and xcb for the
    # docking library; the offscreen platform plugin and a font for the
    # UI tests.
    # Ubuntu's mirror on Azure has handed these packages over at 100 kB/s,
    # fourteen minutes of a job, while the job beside it had them in half a
    # minute (2026-11-10). So their .deb files are kept in the Actions cache,
    # under a key made of exactly what apt would download, and the mirror is
    # asked only for a package that changed since. Main saves them, as it
    # does the Rust cache; a pull request saves only when there is nothing
    # to restore at all.
    - name: List what apt would download
      id: apt
      shell: bash
      run: |
        packages="libclang-dev libasound2-dev \
          qt6-base-dev qt6-base-private-dev qt6-qpa-plugins libgl-dev \
          libvulkan-dev libxkbcommon-dev libxcb1-dev fonts-dejavu-core \
          mesa-vulkan-drivers gnome-keyring dbus-daemon"
        sudo apt-get update
        # Each line is a URL, the file's name, its size and its checksum.
        sudo apt-get install --print-uris -qq --no-install-recommends $packages > "$RUNNER_TEMP/apt-uris.txt"
        awk '{ print $2 }' "$RUNNER_TEMP/apt-uris.txt" > "$RUNNER_TEMP/apt-debs.txt"
        release="$(. /etc/os-release && echo "$VERSION_ID")"
        {
          echo "packages=$(echo $packages)"
          echo "prefix=apt-ubuntu-$release-"
          echo "key=apt-ubuntu-$release-$(awk '{ print $2, $4 }' "$RUNNER_TEMP/apt-uris.txt" | sort | sha256sum | cut -c1-16)"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: debs
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.apt.outputs.key }}
        restore-keys: ${{ steps.apt.outputs.prefix }}
    - name: Install native and Qt dependencies
      shell: bash
      run: |
        kept="$RUNNER_TEMP/apt-archives"
        mkdir -p "$kept"
        # apt takes a file already in its archives when its size and checksum
        # are the package's, and downloads the rest.
        find "$kept" -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
        began=$SECONDS
        sudo apt-get install -y --no-install-recommends --download-only ${{ steps.apt.outputs.packages }}
        echo "apt had its $(wc -l < "$RUNNER_TEMP/apt-debs.txt") packages after $((SECONDS - began)) s, with $(find "$kept" -name '*.deb' | wc -l) restored from the cache"
        # What is kept is what this install uses, not an older version beside it.
        rm -rf "$kept" && mkdir -p "$kept"
        while read -r name; do cp "/var/cache/apt/archives/$name" "$kept/"; done < "$RUNNER_TEMP/apt-debs.txt"
        sudo apt-get install -y --no-install-recommends ${{ steps.apt.outputs.packages }}
    - uses: actions/cache/save@v4
      if: ${{ steps.debs.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || steps.debs.outputs.cache-matched-key == '') }}
      with:
        path: ${{ runner.temp }}/apt-archives
        key: ${{ steps.apt.outputs.key }}
    # Ubuntu ships FFmpeg 8; Kerf builds against 9, as on macOS and
    # Windows, so all three test the same FFmpeg. Take a pinned FFmpeg 9.0
    # shared build with libx264; BtbN keeps its month-end builds for about
    # two years. Tests, kerfd, and the bridge load its libraries through
    # LD_LIBRARY_PATH.
    # GitHub's release downloads have answered 504 for an hour at a time
    # (2026-11-09), so the pinned archive is kept in the Actions cache and
    # fetched only when it is not there, with retries over several minutes.
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ffmpeg-archive
        key: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-shared-9.0
    - name: Install FFmpeg
      shell: bash
      run: |
        build=autobuild-2026-09-30-13-08
        name=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-shared-9.0
        sha256=01a9764d0b5364b66cfeb4617557c64321b0e232e172ec73f0a701c5f7694326
        mkdir -p "$RUNNER_TEMP/ffmpeg-archive"
        archive="$RUNNER_TEMP/ffmpeg-archive/$name.tar.xz"
        [ -s "$archive" ] || curl -fsSL --retry 8 --retry-all-errors --retry-delay 30 -o "$archive" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$build/$name.tar.xz"
        echo "$sha256  $archive" | sha256sum -c -
        tar -xJf "$archive" -C "$RUNNER_TEMP"
        root="$RUNNER_TEMP/$name"
        echo "$root/bin" >> "$GITHUB_PATH"
        echo "FFMPEG_DIR=$root" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
        LD_LIBRARY_PATH="$root/lib" "$root/bin/ffmpeg" -hide_banner -version | head -n 1
