name: Package

# Diagnosis only, on a branch that is never merged: how long the compositor
# takes to draw a frame on a Mac's GPU and without it. It packages and
# publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-frames:
    runs-on: macos-latest
    timeout-minutes: 70
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native media dependencies
        run: |
          brew install ffmpeg pkg-config
          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: What draws here
        run: |
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize kern.hv_vmm_present
          system_profiler SPDisplaysDataType || true
      - name: Build the frame bench
        run: cargo build --release -p kerf-compose --example frame_bench
      - name: Frames on the GPU
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=1920x1080:r=24:d=4 -pix_fmt yuv420p clip.mp4
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=s=1920x1080:r=24:d=4 -vf hue=h=90 -pix_fmt yuv420p second.mp4
          time ./target/release/examples/frame_bench clip.mp4 2>&1 | tail -90
      - name: Frames without it
        env:
          KERF_GPU: "0"
        run: |
          time ./target/release/examples/frame_bench clip.mp4 2>&1 | tail -90
