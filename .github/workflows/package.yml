name: Package

# Kerf for Windows, macOS and Linux, each as something that runs on its own, and the
# complete source of each, kept as this run's artifacts: the Windows zip and installer
# (scripts/package-kerf-windows.ps1) and their source (collect-kerf-windows-sources.sh),
# the macOS app (package-kerf-macos.sh) and its source (collect-kerf-macos-sources.sh),
# and the Linux tar.xz (package-kerf-linux.sh) and its source
# (collect-kerf-linux-sources.sh). Both carry a GPL build of FFmpeg: publish each with
# its source. By hand (Actions > Package > Run workflow), and when what makes them
# changes, it publishes nothing. A v<version> tag publishes all four as a GitHub
# release, with that version's section of CHANGELOG.md as its notes; none is signed.
# Then verify-release.yml downloads the release onto fresh runners and runs it.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of main as v<version> (the tag is made for it)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/package-kerf-windows.ps1"
      - "scripts/package-kerf-macos.sh"
      - "scripts/collect-kerf-macos-sources.sh"
      - "scripts/collect-kerf-windows-sources.sh"
      - "scripts/check-kerf-windows.ps1"
      - "scripts/check-kerf-windows-installer.ps1"
      - "scripts/check-kerf-macos.sh"
      - "scripts/package-kerf-linux.sh"
      - "scripts/check-kerf-linux.sh"
      - "scripts/collect-kerf-linux-sources.sh"
      - "tools/kerf-guide/**"
      - "apps/kerf-qt/packaging/**"
      - "apps/kerf-qt/CMakeLists.txt"
      - ".github/workflows/package.yml"
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "scripts/package-kerf-windows.ps1"
      - "scripts/package-kerf-macos.sh"
      - "scripts/collect-kerf-macos-sources.sh"
      - "scripts/collect-kerf-windows-sources.sh"
      - "scripts/check-kerf-windows.ps1"
      - "scripts/check-kerf-windows-installer.ps1"
      - "scripts/check-kerf-macos.sh"
      - "scripts/package-kerf-linux.sh"
      - "scripts/check-kerf-linux.sh"
      - "scripts/collect-kerf-linux-sources.sh"
      - "tools/kerf-guide/**"
      - "apps/kerf-qt/packaging/**"
      - "apps/kerf-qt/CMakeLists.txt"
      - ".github/workflows/package.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The FFmpeg and Qt in the package. BtbN's builds, as they pin the commit of each
  # library they build, which its source needs; see rust-runtime.yml.
  FFMPEG_BUILDS_TAG: autobuild-2026-09-30-13-08
  FFMPEG_BUILDS_COMMIT: 6c9aec5fc9a72ec3abedd1fa84db141fa18cf52b
  FFMPEG_NAME: ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0
  FFMPEG_SHA256: 3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696
  FFMPEG_COMMIT: 2a571b606854520cf89804d8030c8b328e621689
  # The same FFmpeg, built for Linux.
  LINUX_FFMPEG_NAME: ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-shared-9.0
  LINUX_FFMPEG_SHA256: 01a9764d0b5364b66cfeb4617557c64321b0e232e172ec73f0a701c5f7694326
  QT_VERSION: 6.10.3

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # GitHub's release downloads have answered 504 for an hour at a time, so the
      # pinned archive is kept in the Actions cache and fetched, with retries over
      # several minutes, only when it is not there.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-archive
          key: ${{ env.FFMPEG_NAME }}
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $folder = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'ffmpeg-archive')
          $archive = Join-Path $folder "$env:FFMPEG_NAME.zip"
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_BUILDS_TAG/$env:FFMPEG_NAME.zip" -OutFile $archive -MaximumRetryCount 8 -RetryIntervalSec 30
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg archive does not match its checksum" }
          7z x $archive "-o$env:RUNNER_TEMP" | Out-Null
          "FFMPEG_DIR=$(Join-Path $env:RUNNER_TEMP $env:FFMPEG_NAME)" >> $env:GITHUB_ENV
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found in $llvm" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # 6.3 or newer, for x64compatible: installed if missing, brought up to date if older.
          choco upgrade innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "choco could not install Inno Setup" }
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, pack and run the package, and install and uninstall the installer
        shell: pwsh
        run: scripts/package-kerf-windows.ps1
      # The installer check is not satisfied by any installer: one that registers no
      # kerf:// links fails it.
      - name: The installer check fails an installer without links
        shell: pwsh
        run: |
          $stage = (Get-ChildItem target/package -Directory | Select-Object -First 1).FullName
          $out = Join-Path $env:RUNNER_TEMP 'without-links'
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp "/DSource=$stage" /DVersion=0.0.0 "/DOutputDir=$out" /DOutputName=without-links /DWithoutLinks /DUncompressed apps/kerf-qt/packaging/windows/kerf.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          # It has to fail where the links are checked, not before.
          $failure = $null
          try { & ./scripts/check-kerf-windows-installer.ps1 -Installer (Join-Path $out 'without-links.exe') } catch { $failure = "$_" }
          if (-not $failure) { throw 'The installer check passed an installer that registers no kerf:// links' }
          if ($failure -notmatch 'kerf:// opens with') { throw "The installer check failed before it reached the links: $failure" }
          Write-Host "Failed, as it should: $failure"
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-windows-x64
          path: |
            target/package/*.zip
            target/package/*.zip.sha256
            target/package/*-setup.exe
            target/package/*-setup.exe.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  sources:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect the source of the package
        run: scripts/collect-kerf-windows-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-windows-x64-source
          path: |
            target/package-source/*.tar
            target/package-source/*.tar.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  # The app and its source on one Mac, since the source is that of the Homebrew
  # formulae this app was built from.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt, FFmpeg and the build tools
        run: |
          brew install ffmpeg qt pkg-config cmake
          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, bundle and run the app
        run: scripts/package-kerf-macos.sh
      - name: Collect the source of the app
        run: scripts/collect-kerf-macos-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-macos
          path: |
            target/package-macos/*.zip
            target/package-macos/*.zip.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-macos-source
          path: |
            target/package-macos-source/*.tar
            target/package-macos-source/*.tar.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  # The Linux package and its source on one machine, since the source holds that of the
  # Ubuntu packages it carries libraries of. Built on the oldest Ubuntu it should run on.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-archive
          key: ${{ env.LINUX_FFMPEG_NAME }}
      - name: Install FFmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg-archive"
          archive="$RUNNER_TEMP/ffmpeg-archive/$LINUX_FFMPEG_NAME.tar.xz"
          [ -s "$archive" ] || curl -fsSL --retry 8 --retry-all-errors --retry-delay 30 -o "$archive" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/$FFMPEG_BUILDS_TAG/$LINUX_FFMPEG_NAME.tar.xz"
          echo "$LINUX_FFMPEG_SHA256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "FFMPEG_DIR=$RUNNER_TEMP/$LINUX_FFMPEG_NAME" >> "$GITHUB_ENV"
      # The build's tools; what Qt's xcb plugin loads, which the package carries; Xvfb
      # to run it; and apt's source lines, for the source of what it carries.
      - name: Install the build tools and Qt's X11 libraries
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libasound2-dev pkg-config patchelf xvfb xauth dpkg-dev \
            libgl-dev libegl-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xinput0 \
            libxcb-sync1 libxcb-xfixes0 libxcb-shm0 libxcb-render0 libxcb-glx0 libxcb-util1 \
            libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, pack and run the package
        run: scripts/package-kerf-linux.sh
      # The source takes several GB; the build's own are no longer needed.
      - name: Free the build's space
        run: rm -rf target/release target/qt-linux
      - name: Collect the source of the package
        run: scripts/collect-kerf-linux-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-linux-x64
          path: |
            target/package-linux/*.tar.xz
            target/package-linux/*.tar.xz.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-linux-x64-source
          path: |
            target/package-linux-source/*.tar
            target/package-linux-source/*.tar.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  # A v<version> tag: every package and its source as a release anyone can download.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [package, sources, macos, linux]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is the workspace's version, and has notes
        id: version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          # Run by hand on main, the release makes the tag v<version> at this commit.
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="v$version"
          if [ "$tag" != "v$version" ]; then
            echo "The tag $tag is not v$version, the version in Cargo.toml" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          awk -v heading="## $version" '$0 == heading {found = 1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section \"## $version\"" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # GitHub takes no release file of 2 GiB or more, and the Windows source is
          # over 3: such a file goes up in parts, with the whole one's sha256 and how
          # to join them in the notes.
          for file in dist/*; do
            [ "$(stat -c %s "$file")" -ge 2000000000 ] || continue
            name="$(basename "$file")"
            split -b 1900m -d -a 2 "$file" "$file.part-"
            rm "$file"
            {
              echo
              echo "$name is in parts. Join them, then check it against $name.sha256:"
              echo
              echo '```sh'
              echo "cat $name.part-* > $name && shasum -a 256 -c $name.sha256"
              echo '```'
            } >> notes.md
          done
          ls -l dist
          # A run that failed partway can leave a draft behind; a published release
          # is never replaced.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          # 0.x is a pre-release: GitHub does not offer it as the latest stable one.
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Industrial Kerf $VERSION" --notes-file notes.md $prerelease

  # The release as someone gets it: downloaded onto fresh runners, with no FFmpeg or
  # Qt there, unpacked and run.
  verify:
    needs: release
    uses: ./.github/workflows/verify-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
