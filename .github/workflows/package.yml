name: Package

# Kerf for Windows and macOS, each as something that runs on its own, and the complete
# source of each, kept as this run's artifacts: the Windows zip
# (scripts/package-kerf-windows.ps1) and its source (collect-kerf-windows-sources.sh),
# and the macOS app (package-kerf-macos.sh) and its source
# (collect-kerf-macos-sources.sh). Both carry a GPL build of FFmpeg: publish each with
# its source. By hand (Actions > Package > Run workflow), and when what makes them
# changes, it publishes nothing. A v<version> tag publishes all four as a GitHub
# release, with that version's section of CHANGELOG.md as its notes; none is signed.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release of main as v<version> (the tag is made for it)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/package-kerf-windows.ps1"
      - "scripts/package-kerf-macos.sh"
      - "scripts/collect-kerf-macos-sources.sh"
      - "scripts/collect-kerf-windows-sources.sh"
      - "apps/kerf-qt/packaging/**"
      - "apps/kerf-qt/CMakeLists.txt"
      - ".github/workflows/package.yml"
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "scripts/package-kerf-windows.ps1"
      - "scripts/package-kerf-macos.sh"
      - "scripts/collect-kerf-macos-sources.sh"
      - "scripts/collect-kerf-windows-sources.sh"
      - "apps/kerf-qt/packaging/**"
      - "apps/kerf-qt/CMakeLists.txt"
      - ".github/workflows/package.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The FFmpeg and Qt in the package. BtbN's builds, as they pin the commit of each
  # library they build, which its source needs; see rust-runtime.yml.
  FFMPEG_BUILDS_TAG: autobuild-2026-09-30-13-08
  FFMPEG_BUILDS_COMMIT: 6c9aec5fc9a72ec3abedd1fa84db141fa18cf52b
  FFMPEG_NAME: ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0
  FFMPEG_SHA256: 3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696
  FFMPEG_COMMIT: 2a571b606854520cf89804d8030c8b328e621689
  QT_VERSION: 6.10.3

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$env:FFMPEG_BUILDS_TAG/$env:FFMPEG_NAME.zip" -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:FFMPEG_SHA256) { throw "FFmpeg archive does not match its checksum" }
          7z x $archive "-o$env:RUNNER_TEMP" | Out-Null
          "FFMPEG_DIR=$(Join-Path $env:RUNNER_TEMP $env:FFMPEG_NAME)" >> $env:GITHUB_ENV
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found in $llvm" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, pack and run the package
        shell: pwsh
        run: scripts/package-kerf-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-windows-x64
          path: |
            target/package/*.zip
            target/package/*.zip.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  sources:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Collect the source of the package
        run: scripts/collect-kerf-windows-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-windows-x64-source
          path: |
            target/package-source/*.tar
            target/package-source/*.tar.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  # The app and its source on one Mac, since the source is that of the Homebrew
  # formulae this app was built from.
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt, FFmpeg and the build tools
        run: |
          brew install ffmpeg qt pkg-config cmake
          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, bundle and run the app
        run: scripts/package-kerf-macos.sh
      - name: Collect the source of the app
        run: scripts/collect-kerf-macos-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-macos
          path: |
            target/package-macos/*.zip
            target/package-macos/*.zip.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-kerf-macos-source
          path: |
            target/package-macos-source/*.tar
            target/package-macos-source/*.tar.sha256
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  # A v<version> tag: both packages and their source as a release anyone can download.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [package, sources, macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag is the workspace's version, and has notes
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          # Run by hand on main, the release makes the tag v<version> at this commit.
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="v$version"
          if [ "$tag" != "v$version" ]; then
            echo "The tag $tag is not v$version, the version in Cargo.toml" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          awk -v heading="## $version" '$0 == heading {found = 1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section \"## $version\"" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # GitHub takes no release file of 2 GiB or more, and the Windows source is
          # over 3: such a file goes up in parts, with the whole one's sha256 and how
          # to join them in the notes.
          for file in dist/*; do
            [ "$(stat -c %s "$file")" -ge 2000000000 ] || continue
            name="$(basename "$file")"
            split -b 1900m -d -a 2 "$file" "$file.part-"
            rm "$file"
            {
              echo
              echo "$name is in parts. Join them, then check it against $name.sha256:"
              echo
              echo '```sh'
              echo "cat $name.part-* > $name && shasum -a 256 -c $name.sha256"
              echo '```'
            } >> notes.md
          done
          ls -l dist
          # A run that failed partway can leave a draft behind; a published release
          # is never replaced.
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then
            gh release delete "$TAG" --yes
          fi
          # 0.x is a pre-release: GitHub does not offer it as the latest stable one.
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Industrial Kerf $VERSION" --notes-file notes.md $prerelease
