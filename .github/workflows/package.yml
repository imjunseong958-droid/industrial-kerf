name: Package

# Diagnosis only, on a branch that is never merged: how big whisper.cpp's
# whisper-cli is on each system as one program, what it links, and how fast it
# runs there. It packages and publishes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whisper-size:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Build whisper-cli 1.9.5 as one program
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp
          cd whisper.cpp
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF > cmake.log 2>&1 || { tail -40 cmake.log; exit 1; }
          cmake --build build --config Release -j 4 --target whisper-cli > build.log 2>&1 || { tail -60 build.log; exit 1; }
          find build -name 'whisper-cli*' -type f -exec ls -l {} \;
      - name: Without the GPU (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd whisper.cpp
          cmake -B build-cpu -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_METAL=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF > cmake-cpu.log 2>&1 || { tail -40 cmake-cpu.log; exit 1; }
          cmake --build build-cpu --config Release -j 4 --target whisper-cli > build-cpu.log 2>&1 || { tail -60 build-cpu.log; exit 1; }
          ls -l build-cpu/bin/whisper-cli
          echo "--- with Metal links:"; otool -L build/bin/whisper-cli
          echo "--- without:"; otool -L build-cpu/bin/whisper-cli
          strip -o stripped build/bin/whisper-cli && ls -l stripped
      - name: What it links (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd whisper.cpp
          ldd build/bin/whisper-cli
          strip -o stripped build/bin/whisper-cli && ls -l stripped
      - name: What it links (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd whisper.cpp
          find build -name '*.dll' -exec ls -l {} \; || true
          ls -l build/bin/Release || true
      - name: How fast it is here
        shell: bash
        run: |
          cd whisper.cpp
          cli="$(find build -name 'whisper-cli' -type f -o -name 'whisper-cli.exe' -type f | head -n 1)"
          python3 -c "import os; print('cpus', os.cpu_count())"
          for model in base-q5_1 small-q5_1; do
            curl -fsSL --retry 5 -o "ggml-$model.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$model.bin"
            for flags in "" "-ng"; do
              echo "=== $model $flags"
              "$cli" -m "ggml-$model.bin" -f samples/jfk.wav -t 4 $flags 2>&1 | grep -E "total time|encode time|use gpu|Metal|backend|load time" | head -8
            done
          done
