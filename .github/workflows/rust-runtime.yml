name: Rust runtime

# DIAGNOSTIC BRANCH, NOT TO BE MERGED: whether Kerf decodes on the hosted
# Windows runner, which has no D3D11 video device, now that d3d11va is asked
# for only where a device opens. Run by hand only (Actions > Rust runtime >
# Run workflow, on this branch).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win-hwaccel:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      KERF_AGENT: C:\nonexistent\agent.json
      KERF_MODELS: C:\nonexistent\models.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-archive
          key: ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $build = 'autobuild-2026-09-30-13-08'
          $name = 'ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0'
          $sha256 = '3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696'
          $folder = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'ffmpeg-archive')
          $archive = Join-Path $folder "$name.zip"
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$build/$name.zip" -OutFile $archive -MaximumRetryCount 8 -RetryIntervalSec 30
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha256) { throw "FFmpeg $name archive does not match its checksum" }
          7z x $archive "-o$target" | Out-Null
          $root = (Get-ChildItem $target -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          $llvm = 'C:\Program Files\LLVM\bin'
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # What Kerf asks of ffmpeg, by hand: the listing, the device it tries,
      # and a decode with d3d11va named, with ffmpeg's auto, and with none.
      - name: ffmpeg by hand
        shell: pwsh
        run: |
          Write-Host "KERF_HWACCEL is '$env:KERF_HWACCEL'"
          ffmpeg -hide_banner -hwaccels 2>&1 | ForEach-Object { Write-Host "  $_" }
          foreach ($kind in @('d3d11va', 'dxva2', 'd3d12va')) {
            ffmpeg -hide_banner -loglevel error -init_hw_device $kind -f lavfi -i color=black:s=16x16 -frames:v 1 -f null - 2>&1 | Select-Object -Last 4 | ForEach-Object { Write-Host "  $_" }
            Write-Host "DEVICE -init_hw_device ${kind}: ffmpeg exit $LASTEXITCODE"
          }
          $clip = Join-Path $env:TEMP 'kerf-diag-clip.mp4'
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=30:duration=2 -c:v libx264 -pix_fmt yuv420p $clip
          foreach ($accel in @('d3d11va', 'auto', 'none')) {
            ffmpeg -hide_banner -loglevel info -hwaccel $accel -i $clip -vf scale=160:90 -frames:v 4 -f null - 2>&1 | Select-String -Pattern 'hwaccel|[Dd]evice|Error|error|frame=' | Select-Object -Last 8 | ForEach-Object { Write-Host "  $_" }
            Write-Host "DECODE -hwaccel ${accel}: ffmpeg exit $LASTEXITCODE"
          }
          exit 0
      - name: Build
        shell: pwsh
        run: |
          cargo build -q -p kerf-runtime --bin kerfd
          cargo test -q -p kerf-mcp --test harness --no-run
      - name: The choosing, given listed and opens
        shell: pwsh
        run: cargo test -q -p kerf-engine --lib "ffmpeg::"
      # The two that failed here with "No device available for decoder".
      # KERF_HWACCEL is not set: they pass only if Kerf chose no d3d11va.
      - name: Kerf's look tests as the machine is
        shell: pwsh
        run: |
          if ($env:KERF_HWACCEL) { throw "KERF_HWACCEL is set to '$env:KERF_HWACCEL'" }
          cargo test -p kerf-mcp --test harness -- look_scans_with_sheets look_shows_the_document 2>&1 | Select-String -Pattern 'test |test result|FAILED|panicked|d3d11va|unavailable|Error|error' | ForEach-Object { $l = "$_"; Write-Host $l.Substring(0, [Math]::Min(600, $l.Length)) }
          exit $LASTEXITCODE
      # The control: named by the person, d3d11va is still asked for with
      # nothing tried first, so on this machine the same tests fail as they
      # did before. Its outcome is told, and does not fail the run.
      - name: The same tests with KERF_HWACCEL=d3d11va
        id: named
        continue-on-error: true
        shell: pwsh
        env:
          KERF_HWACCEL: d3d11va
        run: |
          cargo test -p kerf-mcp --test harness -- look_scans_with_sheets look_shows_the_document 2>&1 | Select-String -Pattern 'test |test result|FAILED|panicked|d3d11va|unavailable|Error|error' | ForEach-Object { $l = "$_"; Write-Host $l.Substring(0, [Math]::Min(600, $l.Length)) }
          exit $LASTEXITCODE
      - name: What the control showed
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Host "CONTROL with KERF_HWACCEL=d3d11va: ${{ steps.named.outcome }} (failure expected on a machine with no D3D11 video device)"
