name: Rust runtime

# Linux carries the testing, the Qt editor included; Windows and macOS
# check what differs on them. The repository is public, so hosted runners
# cost nothing and all three run side by side on every pull request, every
# merge to main, and by hand (Actions > Rust runtime > Run workflow).
# Feature branches are not built on push: their pull request runs the
# jobs. A weekly run catches what a newer toolchain, Qt, or FFmpeg broke.
on:
  schedule:
    # Mondays, 03:00 in Seoul.
    - cron: "0 18 * * 0"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "tools/**"
      - "apps/kerf-qt/**"
      - "scripts/test-kerf-qt-bridge.py"
      - ".github/workflows/rust-runtime.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/**"
      - "tools/**"
      - "apps/kerf-qt/**"
      - "scripts/test-kerf-qt-bridge.py"
      - ".github/workflows/rust-runtime.yml"
  workflow_dispatch:

# A newer push to a pull request supersedes its running checks; runs on main
# each finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      # The runner has no GPU. Limiting wgpu to Vulkan, which has no driver
      # here, keeps it off Mesa's software GL, so the GPU tests skip
      # themselves rather than compare against a software rasterizer.
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # libclang for ffmpeg-sys-next's bindgen; ALSA for playback's audio
      # output (cpal); Qt with its private GUI headers and xcb for the
      # docking library; the offscreen platform plugin and a font for the
      # UI tests.
      - name: Install native and Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev libasound2-dev \
            qt6-base-dev qt6-base-private-dev qt6-qpa-plugins libgl-dev \
            libvulkan-dev libxkbcommon-dev libxcb1-dev fonts-dejavu-core \
            mesa-vulkan-drivers
      # Ubuntu ships FFmpeg 8; Kerf builds against 9, as on macOS and
      # Windows, so all three test the same FFmpeg. Take a pinned FFmpeg 9.0
      # shared build with libx264; BtbN keeps its month-end builds for about
      # two years. Tests, kerfd, and the bridge load its libraries through
      # LD_LIBRARY_PATH.
      # GitHub release downloads sometimes answer 504 for a minute; retry
      # rather than fail the job (main failed this way on 2026-11-08).
      - name: Install FFmpeg
        run: |
          build=autobuild-2026-09-30-13-08
          name=ffmpeg-n9.0.2-17-g2a571b6068-linux64-gpl-shared-9.0
          sha256=01a9764d0b5364b66cfeb4617557c64321b0e232e172ec73f0a701c5f7694326
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o "$archive" "https://github.com/BtbN/FFmpeg-Builds/releases/download/$build/$name.tar.xz"
          echo "$sha256  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          root="$RUNNER_TEMP/$name"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$root/lib" "$root/bin/ffmpeg" -hide_banner -version | head -n 1
      # Caches the registry and dependency builds, keyed on Cargo.lock.
      # Workspace crates, the EffectCraft ones included, rebuild each run.
      # Only main saves, in all three jobs: a pull request's own cache would
      # serve only that pull request, so pull requests restore main's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test workspace
        env:
          KERF_PARITY_DUMP: ${{ runner.temp }}/parity
        run: |
          mkdir -p "$KERF_PARITY_DUMP"
          cargo test --workspace
      # Which of the catalog goes to the CPU, asked of Mesa's llvmpipe in place
      # of a GPU: looks, grades and transitions stay on the GPU. Only this
      # runs on llvmpipe; its pow and exp are a byte off color.basic's.
      - name: Test what the catalog sends to the CPU
        env:
          KERF_GPU: software
        run: cargo test -p kerf-compose --test catalog_cost -- --nocapture
      # The rest of the gate README.md's Verification names.
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      # The frames the compositor parity tests compared, drawn both ways,
      # to look at when one fails.
      - name: Upload compositor parity frames
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compositor-parity-frames
          path: ${{ runner.temp }}/parity
          retention-days: 14
      - name: Build native bridge and daemon for integration tests
        run: cargo build -p kerf-qt-bridge -p kerf-runtime --lib --bin kerfd
      - name: Build Qt editor and UI tests
        run: |
          cmake -S apps/kerf-qt -B target/qt -DKERF_QT_BUILD_TESTS=ON
          cmake --build target/qt --parallel "$(nproc)"
      - name: Test Qt UI
        run: ctest --test-dir target/qt --output-on-failure
      - name: Test real media and cross-client workflow
        run: python3 scripts/test-kerf-qt-bridge.py

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # kerf-runtime reaches libav through kerf-engine and kerf-compose
      # (ffmpeg-sys-next), which needs FFmpeg's headers and import libraries
      # and libclang for bindgen. The runner has LLVM but no FFmpeg, so take
      # a pinned shared build; its DLLs go on PATH for the tests. The build the
      # Windows package carries (windows-package.yml), so that is what is tested.
      # GitHub release downloads sometimes answer 504 for a minute; retry
      # rather than fail the job (main failed this way on 2026-11-08).
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $build = 'autobuild-2026-09-30-13-08'
          $name = 'ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0'
          $sha256 = '3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696'
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$build/$name.zip" -OutFile $archive -MaximumRetryCount 5 -RetryIntervalSec 10
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha256) { throw "FFmpeg $name archive does not match its checksum" }
          7z x $archive "-o$target" | Out-Null
          $root = (Get-ChildItem $target -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "libclang.dll not found in $llvm" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      # Qt for MSVC, with its bin folder on PATH so the editor and its
      # tests find Qt's DLLs and plugins.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.*"
          arch: win64_msvc2022_64
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The kernel and the durable runtime against Windows paths, line
      # endings, and processes. The runtime's integration tests start real
      # kerfd daemons and reach them over the named pipe.
      - name: Test kernel and interchange
        run: cargo test -p kerf-model -p kerf-lang -p kerf-interchange
      - name: Test durable runtime
        run: cargo test -p kerf-runtime --all-targets
      # Sidecars run in job objects, which end them with kerfd.
      - name: Test sidecar supervision
        run: cargo test -p kerf-engine --lib "sidecar::"
      # The editor steps run even when a test above failed, so the bridge
      # they link is built regardless.
      - name: Build native bridge and daemon
        if: ${{ !cancelled() }}
        run: cargo build -p kerf-qt-bridge -p kerf-runtime --lib --bin kerfd
      # The editor's C ABI starts kerfd and edits through the pipe beside
      # another client. On Windows it also fails on any access violation,
      # handled or not; it runs a few times, since a crash once came and
      # went.
      - name: Test editor connection to kerfd
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          for ($run = 1; $run -le 5; $run++) {
            cargo test -q -p kerf-qt-bridge --test connection -- --nocapture
            if ($LASTEXITCODE -ne 0) { "failed on run $run"; exit 1 }
          }
      - name: Build Qt editor and UI tests
        if: ${{ !cancelled() }}
        run: |
          cmake -S apps/kerf-qt -B target/qt -DKERF_QT_BUILD_TESTS=ON
          cmake --build target/qt --config Release --parallel 4
      # Qt logs to the debugger on Windows unless told otherwise.
      - name: Test Qt UI
        if: ${{ !cancelled() }}
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: ctest --test-dir target/qt -C Release --output-on-failure

  macos-editor:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Homebrew's current FFmpeg, as developers and scripts/install-kerf-local.sh
      # build against; ffmpeg-next 9 binds it.
      - name: Install native media and Qt dependencies
        run: |
          brew install ffmpeg qt pkg-config cmake
          ffmpeg_prefix="$(brew --prefix ffmpeg)"
          echo "$ffmpeg_prefix/bin" >> "$GITHUB_PATH"
          echo "FFMPEG_DIR=$ffmpeg_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$ffmpeg_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Only what Linux cannot show: the editor's dylib against Homebrew's
      # libav and Qt, the macOS Qt build, and the daemon's macOS peer check
      # and sockets, which the bridge workflow below goes through.
      - name: Build native bridge and daemon for integration tests
        run: cargo build -p kerf-qt-bridge -p kerf-runtime --lib --bin kerfd
      - name: Build Qt editor and UI tests
        run: |
          cmake -S apps/kerf-qt -B target/qt -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DKERF_QT_BUILD_TESTS=ON
          cmake --build target/qt --parallel 3
      - name: Test Qt UI
        run: ctest --test-dir target/qt --output-on-failure
      - name: Test real media and cross-client workflow
        run: python3 scripts/test-kerf-qt-bridge.py
