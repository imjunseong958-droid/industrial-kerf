name: Rust runtime

# Linux carries the testing, the Qt editor included; Windows and macOS
# check what differs on them. The repository is public, so hosted runners
# cost nothing: the systems run side by side, and so do the parts of one
# that do not wait on each other (Linux's tests, lint and editor; macOS's
# editor and workspace), on every pull request, every merge to main, and by
# hand (Actions > Rust runtime > Run workflow). A run takes as long as its
# slowest job, not the sum of them.
# Feature branches are not built on push: their pull request runs the
# jobs. A weekly run catches what a newer toolchain, Qt, or FFmpeg broke.
# DIAGNOSTIC BRANCH, NOT TO BE MERGED: whether VideoToolbox encodes on the
# hosted macOS runner, a virtual machine, or stops answering as its decoder
# does there.
on:
  workflow_dispatch:

jobs:
  vt-encode:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: The machine
        run: |
          sw_vers
          sysctl kern.hv_vmm_present machdep.cpu.brand_string hw.model hw.ncpu || true
          brew install ffmpeg
          ffmpeg -version | head -1
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -i videotoolbox || true
          ffmpeg -hide_banner -hwaccels 2>/dev/null || true
      - name: Encode with each VideoToolbox encoder, 40 s at most each
        run: |
          try() {
            name="$1"; shift
            echo "===== $name: ffmpeg $*"
            ffmpeg -hide_banner -nostdin -y "$@" > "/tmp/$name.log" 2>&1 &
            pid=$!
            n=0
            while kill -0 "$pid" 2>/dev/null && [ "$n" -lt 80 ]; do sleep 0.5; n=$((n+1)); done
            if kill -0 "$pid" 2>/dev/null; then
              echo "RESULT $name: STILL RUNNING after 40 s"
              tail -5 "/tmp/$name.log"
              sample "$pid" 2 2>/dev/null | sed -n '1,70p' || true
              kill -9 "$pid" 2>/dev/null || true
            else
              wait "$pid"; code=$?
              echo "RESULT $name: ended with $code after about $((n/2)) s"
              tail -4 "/tmp/$name.log"
            fi
          }
          src="-f lavfi -i testsrc2=size=1280x720:rate=30:duration=4"
          try h264_vt $src -c:v h264_videotoolbox -b:v 4M /tmp/h264_vt.mp4
          try h264_vt_hw_only $src -c:v h264_videotoolbox -allow_sw 0 -require_sw 0 -b:v 4M /tmp/h264_vt_hw.mp4
          try h264_vt_sw $src -c:v h264_videotoolbox -require_sw 1 -b:v 4M /tmp/h264_vt_sw.mp4
          try hevc_vt $src -c:v hevc_videotoolbox -b:v 4M -tag:v hvc1 /tmp/hevc_vt.mp4
          try hevc_vt_sw $src -c:v hevc_videotoolbox -require_sw 1 -b:v 4M -tag:v hvc1 /tmp/hevc_vt_sw.mp4
          try prores_vt $src -c:v prores_videotoolbox -profile:v hq /tmp/prores_vt.mov
          try x264 $src -c:v libx264 -preset ultrafast /tmp/x264.mp4
          ls -la /tmp/*.mp4 /tmp/*.mov 2>/dev/null || true
          echo "===== decode, for comparison: the file x264 made, through VideoToolbox"
          try decode_vt -hwaccel videotoolbox -i /tmp/x264.mp4 -f null -
          try decode_sw -i /tmp/x264.mp4 -f null -
          for f in /tmp/h264_vt.mp4 /tmp/hevc_vt.mp4 /tmp/prores_vt.mov; do
            [ -s "$f" ] && ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,nb_frames,width,height -of csv=p=0 "$f" || echo "no $f"
          done

  # Whether a contact sheet's time labels are drawn on Windows: the font is
  # written to the temporary folder and handed to ffmpeg's drawtext, with a
  # drive letter and backslashes in its path.
  win-sheet-labels:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      KERF_AGENT: C:\nonexistent\agent.json
      KERF_MODELS: C:\nonexistent\models.json
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-archive
          key: ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $build = 'autobuild-2026-09-30-13-08'
          $name = 'ffmpeg-n9.0.2-17-g2a571b6068-win64-gpl-shared-9.0'
          $sha256 = '3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696'
          $folder = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'ffmpeg-archive')
          $archive = Join-Path $folder "$name.zip"
          $target = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          if (-not (Test-Path $archive)) {
            Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/$build/$name.zip" -OutFile $archive -MaximumRetryCount 8 -RetryIntervalSec 30
          }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $sha256) { throw "FFmpeg $name archive does not match its checksum" }
          7z x $archive "-o$target" | Out-Null
          $root = (Get-ChildItem $target -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$root" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
          $llvm = 'C:\Program Files\LLVM\bin'
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV
      - name: The filter as Kerf builds it, given to ffmpeg by hand
        shell: pwsh
        run: |
          ffmpeg -hide_banner -version | Select-Object -First 1
          ffmpeg -hide_banner -filters | Select-String ' drawtext '
          $frames = Join-Path $env:TEMP 'kerf-diag-frames'
          New-Item -ItemType Directory -Force -Path $frames | Out-Null
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=320x180:rate=1:duration=4 -start_number 0 (Join-Path $frames 'frame-%03d.jpg')
          function Sheet($name, $fontPath) {
            # filter_text: backslashes to slashes, ' to a typographic one, ':' and '%' escaped; in single quotes.
            $f = $fontPath.Replace('\', '/').Replace("'", [string][char]0x2019).Replace(':', '\:').Replace('%', '\%')
            $vf = "drawtext=fontfile='$f':text='00\:00\:01\:15':enable='eq(n\,0)':x=w/40:y=w/40:fontsize=h/11:fontcolor=white:box=1:boxcolor=black@0.6:boxborderw=6,tile=2x2:padding=0:margin=0"
            $out = Join-Path $env:TEMP "sheet-$name.jpg"
            Write-Host "===== $name"
            Write-Host "font: $fontPath"
            Write-Host "-vf $vf"
            ffmpeg -hide_banner -loglevel error -framerate 1 -start_number 0 -i (Join-Path $frames 'frame-%03d.jpg') -vf $vf -frames:v 1 -q:v 3 -y $out
            Write-Host "RESULT ${name}: ffmpeg exit $LASTEXITCODE, sheet $(if (Test-Path $out) { (Get-Item $out).Length } else { 'missing' })"
          }
          $font = Join-Path $env:TEMP 'kerf-inter-medium-diag.ttf'
          Copy-Item 'C:\Windows\Fonts\arial.ttf' $font
          Write-Host "TEMP is $env:TEMP"
          Sheet 'temp' $font
          $spaced = Join-Path $env:TEMP 'Mary Ann (work)'
          New-Item -ItemType Directory -Force -Path $spaced | Out-Null
          Copy-Item $font (Join-Path $spaced 'font.ttf')
          Sheet 'space-and-brackets' (Join-Path $spaced 'font.ttf')
          $quoted = Join-Path $env:TEMP "O'Brien"
          New-Item -ItemType Directory -Force -Path $quoted | Out-Null
          Copy-Item $font (Join-Path $quoted 'font.ttf')
          Sheet 'apostrophe' (Join-Path $quoted 'font.ttf')
          $hangul = Join-Path $env:TEMP '임준성'
          New-Item -ItemType Directory -Force -Path $hangul | Out-Null
          Copy-Item $font (Join-Path $hangul 'font.ttf')
          Sheet 'hangul' (Join-Path $hangul 'font.ttf')
          exit 0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Kerf's own sheet tests, on Windows
        shell: pwsh
        run: |
          cargo build -p kerf-runtime --bin kerfd
          cargo test -p kerf-mcp --test harness -- look_scans_with_sheets look_shows_the_document --nocapture
