[package]
name = "cut-desktop"
version = "0.1.0"
description = "Cut desktop shell"
authors = ["Cut contributors"]
edition = "2021"
rust-version = "1.77"
default-run = "cut-desktop"

[lib]
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cut-runtime = { path = "../../../crates/cut-runtime" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Keep the desktop shell's Tauri dependency graph independent from the media
# engine workspace. The shell is a native application boundary, not an engine
# crate, so changing it must not rebuild the engine workspace.
[workspace]
