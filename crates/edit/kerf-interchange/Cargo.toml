[package]
name = "kerf-interchange"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Project interchange for Kerf: OpenTimelineIO, Final Cut Pro XML, and CMX3600 EDL"

[dependencies]
kerf-model = { path = "../../foundation/kerf-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
kerf-lang = { path = "../../foundation/kerf-lang" }
# The FCPXML the writer makes, read back as a tree.
roxmltree = "0.21"
tempfile = "3"

# Empty on purpose: this crate does not take the workspace's lints. The root
# Cargo.toml says why.
[lints]
