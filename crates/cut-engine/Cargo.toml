[package]
name = "cut-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cut media engine: probe, encode, compile, proxy, and region planning"

[lib]
name = "cut_engine"
path = "src/lib.rs"

[[bin]]
name = "cut-engine"
path = "src/bin/cut-engine.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cut-core = { path = "../cut-core" }
cut-model = { path = "../cut-model" }
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
cut-lang = { path = "../cut-lang" }
approx = "0.5"
criterion = "0.5"
cut-playback = { path = "../cut-playback", default-features = false }
tempfile = "3"

[[bench]]
name = "engine_hotpath"
harness = false
