[package]
name = "kerf-playback"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Kerf playback controller, timeline mapper, and in-process libav decoder"
rust-version = "1.95"

[lib]
name = "kerf_playback"
path = "src/lib.rs"

[features]
default = ["native-audio"]
native-audio = ["dep:cpal", "dep:windows-sys"]

[dependencies]
cpal = { version = "0.15.3", optional = true }
kerf-compose = { path = "../../engine/kerf-compose" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-fx = { path = "../../effects/kerf-fx" }
kerf-model = { path = "../../foundation/kerf-model" }
ffmpeg-next = { workspace = true, features = [
    "codec",
    "filter",
    "format",
    "software-resampling",
    "software-scaling",
] }
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true, features = ["Win32_System_Com"] }

[dev-dependencies]
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
tempfile.workspace = true

[lints]
workspace = true
