[package]
name = "kerf-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf's compositor: a sequence drawn frame by frame in linear light, with footage decoded by libav"

[dependencies]
kerf-color = { path = "../../foundation/kerf-color" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-draw = { path = "../../render/kerf-draw" }
kerf-fx = { path = "../../effects/kerf-fx" }
kerf-gpu = { path = "../../render/kerf-gpu" }
kerf-image = { path = "../../image/kerf-image" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-motion = { path = "../../motion/kerf-motion" }
kerf-raster = { path = "../../render/kerf-raster" }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "filter", "format", "software-scaling"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
rayon = "1"
thiserror = "2"

[dev-dependencies]
kerf-lang = { path = "../../foundation/kerf-lang" }
tempfile = "3"
