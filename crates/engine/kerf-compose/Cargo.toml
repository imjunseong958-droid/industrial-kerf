[package]
name = "kerf-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kerf's compositor: a sequence drawn frame by frame in linear light, with footage decoded by libav"

[dependencies]
kerf-color = { path = "../../foundation/kerf-color" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-draw = { path = "../../render/kerf-draw" }
kerf-fx = { path = "../../effects/kerf-fx" }
kerf-geom = { path = "../../foundation/kerf-geom" }
kerf-gpu = { path = "../../render/kerf-gpu" }
kerf-image = { path = "../../image/kerf-image" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-motion = { path = "../../motion/kerf-motion" }
kerf-sim = { path = "../../motion/kerf-sim" }
kerf-paths = { path = "../../foundation/kerf-paths" }
kerf-raster = { path = "../../render/kerf-raster" }
ffmpeg-next = { workspace = true, features = [
    "codec",
    "filter",
    "format",
    "software-scaling",
] }
log.workspace = true
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
rayon.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
kerf-text = { path = "../../foundation/kerf-text" }
kerf-lang = { path = "../../foundation/kerf-lang" }
tempfile.workspace = true

[lints]
workspace = true
