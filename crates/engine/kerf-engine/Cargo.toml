[package]
name = "kerf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf media engine: probe, encode, compile, render, proxy, and transcription"

[lib]
name = "kerf_engine"
path = "src/lib.rs"

[[bin]]
name = "kerf-engine"
path = "src/bin/kerf-engine.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
kerf-color = { path = "../../foundation/kerf-color" }
kerf-compose = { path = "../../engine/kerf-compose" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-fx = { path = "../../effects/kerf-fx" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
hex = "0.4"
mimalloc = { version = "0.1", default-features = false }
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
kerf-playback = { path = "../../engine/kerf-playback", default-features = false }
tempfile = "3"

[[bench]]
name = "engine_hotpath"
harness = false
