[package]
name = "kerf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf media engine: probe, encode, compile, render, proxy, and transcription"

[lib]
name = "kerf_engine"
path = "src/lib.rs"

[[bin]]
name = "kerf-engine"
path = "src/bin/kerf-engine.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
kerf-color = { path = "../../foundation/kerf-color" }
kerf-compose = { path = "../../engine/kerf-compose" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-fx = { path = "../../effects/kerf-fx" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-track = { path = "../../vfx/kerf-track" }
hex.workspace = true
mimalloc = { version = "0.1", default-features = false }
rayon.workspace = true
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
