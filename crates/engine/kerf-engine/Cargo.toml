[package]
name = "kerf-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Kerf media engine: probe, encode, compile, render, proxy, and transcription"

[lib]
name = "kerf_engine"
path = "src/lib.rs"

[[bin]]
name = "kerf-engine"
path = "src/bin/kerf-engine.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
kerf-color = { path = "../../foundation/kerf-color" }
kerf-compose = { path = "../../engine/kerf-compose" }
# What a model is asked, as the Kerf generation API says it.
kerf-generate-api = { path = "../../foundation/kerf-generate-api" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-paths = { path = "../../foundation/kerf-paths" }
kerf-sidecar = { path = "../../foundation/kerf-sidecar" }
kerf-track = { path = "../../vfx/kerf-track" }
hex.workspace = true
log.workspace = true
mimalloc.workspace = true
rayon.workspace = true
regex = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
