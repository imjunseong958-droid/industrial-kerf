[package]
name = "kerf-compose"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf's compositor: a sequence drawn frame by frame in linear light, with footage decoded by libav"

[dependencies]
kerf-core = { path = "../kerf-core" }
kerf-draw = { path = "../kerf-draw" }
kerf-fx = { path = "../kerf-fx" }
kerf-model = { path = "../kerf-model" }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "filter", "format", "software-scaling"] }
thiserror = "2"

[dev-dependencies]
kerf-lang = { path = "../kerf-lang" }
tempfile = "3"
