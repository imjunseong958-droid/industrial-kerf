[package]
name = "kerf-draw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf's drawing: pictures in premultiplied linear light, and the blending, masks, blur, color, and text drawn on them"

# FilmCraft's crates live in `filmcraft/`; the drawing here is carried from
# FilmCraft's renderer in Kerf's terms.
[dependencies]
kerf-model = { path = "../kerf-model" }
filmcraft-color = { path = "../../filmcraft/crates/color" }
filmcraft-geom = { path = "../../filmcraft/crates/geom" }
filmcraft-text = { path = "../../filmcraft/crates/text" }
rayon = "1"
