[package]
name = "cut-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight, deterministic timeline and filtergraph primitives for Cut"

[lib]
name = "cut_core"
path = "src/lib.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
