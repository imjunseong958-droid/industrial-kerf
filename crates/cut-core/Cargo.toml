[package]
name = "cut-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight, deterministic timeline and filtergraph primitives for Cut"

[lib]
name = "cut_core"
path = "src/lib.rs"

[dependencies]
cut-model = { path = "../cut-model" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
cut-lang = { path = "../cut-lang" }
