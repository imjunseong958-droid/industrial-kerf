[package]
name = "cut-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-owner durable runtime and command mailbox for Cut"

[lib]
name = "cut_runtime"
path = "src/lib.rs"

[dependencies]
cut-domain = { path = "../cut-domain" }
cut-engine = { path = "../cut-engine" }
cut-interchange = { path = "../cut-interchange" }
cut-lang = { path = "../cut-lang" }
cut-model = { path = "../cut-model" }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
