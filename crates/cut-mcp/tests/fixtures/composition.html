<!doctype html>
<html>
<head>
  <title>Local composition sidecar</title>
  <style>.card { background-image: url("assets/paper.svg"); }</style>
</head>
<body>
  <main data-composition-id="intro" data-width="1920" data-height="1080"
        data-fps="30" data-duration="5">
    <div id="title" class="card" data-start="0" data-duration="2.5" data-track-index="0">
      Hello &amp; welcome
    </div>
    <img id="photo" src="assets/photo.svg?version=1&amp;size=small"
         style="mask-image: url('assets/mask.svg')"
         data-start="1.5" data-duration="3.5" data-track-index="1">
    <section id="outro" data-composition-src="scenes/outro.html"
             data-start="4" data-duration="1" data-track-index="2"></section>
  </main>
</body>
</html>
