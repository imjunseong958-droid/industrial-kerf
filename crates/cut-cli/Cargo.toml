[package]
name = "cut-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native terminal agent and project workflow CLI for Cut"

[[bin]]
name = "lcut"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cut-agent = { path = "../cut-agent" }
cut-fetcher = { path = "../cut-fetcher" }
cut-mcp = { path = "../cut-mcp" }
cut-runtime = { path = "../cut-runtime" }
cut-skills = { path = "../cut-skills" }
serde_json = "1"
