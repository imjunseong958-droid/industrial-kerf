[package]
name = "kerf-qt-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nonblocking C ABI for the Qt editor and Rust workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kerf-core = { path = "../kerf-core" }
kerf-lang = { path = "../kerf-lang" }
kerf-model = { path = "../kerf-model" }
kerf-runtime = { path = "../kerf-runtime" }
kerf-playback = { path = "../kerf-playback" }
kerf-agent = { path = "../kerf-agent" }
kerf-cloud = { path = "../kerf-cloud" }
kerf-collab = { path = "../kerf-collab" }
kerf-commands = { path = "../kerf-commands" }
kerf-mcp = { path = "../kerf-mcp" }
kerf-engine = { path = "../kerf-engine" }
kerf-fx = { path = "../kerf-fx" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }
