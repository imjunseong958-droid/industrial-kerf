[package]
name = "kerf-playback"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Kerf playback controller, timeline mapper, and in-process libav decoder"
rust-version = "1.95"

[lib]
name = "kerf_playback"
path = "src/lib.rs"

[features]
default = ["native-audio"]
native-audio = ["dep:cpal"]

[dependencies]
cpal = { version = "0.15.3", optional = true }
kerf-core = { path = "../kerf-core" }
kerf-model = { path = "../kerf-model" }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
kerf-lang = { path = "../kerf-lang" }
kerf-model = { path = "../kerf-model" }
tempfile = "3"
