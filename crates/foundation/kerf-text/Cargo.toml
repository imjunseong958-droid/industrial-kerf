[package]
name = "kerf-text"
description = "Kerf's text engine (from FilmCraft): font database (bundled + system), shaping, bidi, line breaking, paragraph layout and anti-aliased glyph/path rasterisation"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Font tables, glyph outlines and metrics (MIT OR Apache-2.0). Rasterisation is our own.
skrifa = { version = "0.50", default-features = false, features = ["std"] }
# OpenType shaping (HarfBuzz port, MIT); reads fonts through the same read-fonts as skrifa.
harfrust = { version = "0.16", default-features = false, features = ["std"] }
# Unicode Bidirectional Algorithm (MIT OR Apache-2.0).
unicode-bidi = "0.3.18"
# UAX #14 line breaking (Apache-2.0).
unicode-linebreak = "0.1.5"
# UAX #29 extended grapheme clusters (MIT OR Apache-2.0).
unicode-segmentation = "1.13"
# PNG decoding for colour bitmap glyphs (CBDT / sbix emoji) (MIT OR Apache-2.0).
png = "0.18"

[dev-dependencies]
tempfile.workspace = true
