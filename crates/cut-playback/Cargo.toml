[package]
name = "cut-playback"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Cut playback controller, timeline mapper, and in-process libav decoder"
rust-version = "1.95"

[lib]
name = "cut_playback"
path = "src/lib.rs"

[features]
default = ["native-audio"]
native-audio = ["dep:cpal"]

[dependencies]
cpal = { version = "0.15.3", optional = true }
cut-core = { path = "../cut-core" }
cut-domain = { path = "../cut-domain" }
ffmpeg-next = { version = "9.0", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
cut-core = { path = "../cut-core" }
tempfile = "3"
