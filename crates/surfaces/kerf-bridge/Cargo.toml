[package]
name = "kerf-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Nonblocking editor bridge: commands in, events out, over kerfd and Rust workers"

[dependencies]
# API keys in the OS's own store, the one kerf and kerf-mcp read too.
kerf-secrets = { path = "../../foundation/kerf-secrets" }
kerf-core = { path = "../../engine/kerf-core" }
kerf-color = { path = "../../foundation/kerf-color" }
kerf-compose = { path = "../../engine/kerf-compose" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-paths = { path = "../../foundation/kerf-paths" }
kerf-runtime = { path = "../../surfaces/kerf-runtime" }
kerf-playback = { path = "../../engine/kerf-playback" }
kerf-agent = { path = "../../surfaces/kerf-agent" }
kerf-cloud = { path = "../../surfaces/kerf-cloud" }
kerf-collab = { path = "../../edit/kerf-collab" }
kerf-commands = { path = "../../surfaces/kerf-commands" }
kerf-mcp = { path = "../../surfaces/kerf-mcp" }
kerf-engine = { path = "../../engine/kerf-engine" }
# What reaches the person's models: the providers of their generation.json.
kerf-generate = { path = "../../surfaces/kerf-generate" }
# A shot's graph, read and changed as an agent's tools read and change it.
kerf-shots = { path = "../../surfaces/kerf-shots" }
# The editor waits on the bridge for events and frames (`Wake`) rather than
# asking on a timer.
async-channel.workspace = true
base64.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# Why a command was refused, kept as its kind until an `error` says it (error.rs).
thiserror.workspace = true
# Asking GitHub for Kerf's releases (updates.rs), trusting the system's
# certificates, so a network that inspects TLS with its own CA still works.
ureq = { workspace = true, features = ["json", "platform-verifier"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[lints]
workspace = true
