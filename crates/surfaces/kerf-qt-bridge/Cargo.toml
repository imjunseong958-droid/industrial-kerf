[package]
name = "kerf-qt-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nonblocking C ABI for the Qt editor and Rust workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# API keys in the OS's own store: macOS Keychain, Windows Credential Manager,
# and the Secret Service on Linux, reached over D-Bus in Rust (no libdbus).
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
kerf-core = { path = "../../engine/kerf-core" }
kerf-color = { path = "../../foundation/kerf-color" }
kerf-compose = { path = "../../engine/kerf-compose" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-runtime = { path = "../../surfaces/kerf-runtime" }
kerf-playback = { path = "../../engine/kerf-playback" }
kerf-agent = { path = "../../surfaces/kerf-agent" }
kerf-cloud = { path = "../../surfaces/kerf-cloud" }
kerf-collab = { path = "../../edit/kerf-collab" }
kerf-commands = { path = "../../surfaces/kerf-commands" }
kerf-mcp = { path = "../../surfaces/kerf-mcp" }
kerf-engine = { path = "../../engine/kerf-engine" }
kerf-fx = { path = "../../effects/kerf-fx" }
kerf-interchange = { path = "../../edit/kerf-interchange" }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }
