[package]
name = "kerf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native terminal agent and project workflow CLI for Kerf"

[[bin]]
name = "kerf"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
kerf-agent = { path = "../../surfaces/kerf-agent" }
kerf-collab = { path = "../../edit/kerf-collab" }
kerf-engine = { path = "../../engine/kerf-engine" }
kerf-fetcher = { path = "../../surfaces/kerf-fetcher" }
kerf-interchange = { path = "../../edit/kerf-interchange" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-mcp = { path = "../../surfaces/kerf-mcp" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-paths = { path = "../../foundation/kerf-paths" }
kerf-runtime = { path = "../../surfaces/kerf-runtime" }
kerf-skills = { path = "../../surfaces/kerf-skills" }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
