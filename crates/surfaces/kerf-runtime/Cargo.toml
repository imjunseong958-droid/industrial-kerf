[package]
name = "kerf-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-owner durable runtime and command mailbox for Kerf"

[lib]
name = "kerf_runtime"
path = "src/lib.rs"

[dependencies]
kerf-collab = { path = "../../edit/kerf-collab" }
kerf-engine = { path = "../../engine/kerf-engine" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
