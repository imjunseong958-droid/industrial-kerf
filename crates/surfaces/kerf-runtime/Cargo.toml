[package]
name = "kerf-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Single-owner durable runtime and command mailbox for Kerf"

[lib]
name = "kerf_runtime"
path = "src/lib.rs"

[dependencies]
kerf-collab = { path = "../../edit/kerf-collab" }
kerf-engine = { path = "../../engine/kerf-engine" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-paths = { path = "../../foundation/kerf-paths" }
kerf-protocol = { path = "../../foundation/kerf-protocol" }
# The log kerfd, kerf-mcp and kerf write (`logging`): RUST_LOG's filter, and
# each line's time. No colour: kerfd's log is a file. env_filter, which
# env_logger reads RUST_LOG with, reads kerfd's without a word on stderr.
env_filter = { version = "2", default-features = false }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
fs2 = "0.4"
libc.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[lints]
workspace = true
