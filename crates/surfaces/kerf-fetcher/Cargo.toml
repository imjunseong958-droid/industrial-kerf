[package]
name = "kerf-fetcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Safe yt-dlp adapter for the native Kerf workflow"

[dependencies]
# yt-dlp runs as one of its sidecars, so that the FFmpeg yt-dlp starts ends
# with it, and a forwarded Ctrl-C reaches both. `kerf`, which uses this crate,
# links kerf-engine already.
kerf-engine = { path = "../../engine/kerf-engine" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
