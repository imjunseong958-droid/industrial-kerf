[package]
name = "kerf-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Project-scoped MCP stdio router for the native Kerf runtime"

[lib]
name = "kerf_mcp"
path = "src/lib.rs"

[[bin]]
name = "kerf-mcp"
path = "src/bin/kerf-mcp.rs"

[dependencies]
base64.workspace = true
kerf-agent = { path = "../../surfaces/kerf-agent" }
kerf-color = { path = "../../foundation/kerf-color" }
kerf-compose = { path = "../../engine/kerf-compose" }
kerf-engine = { path = "../../engine/kerf-engine" }
# The timeline files `render` hands another editor.
kerf-interchange = { path = "../../edit/kerf-interchange" }
kerf-lang = { path = "../../foundation/kerf-lang" }
kerf-model = { path = "../../foundation/kerf-model" }
kerf-paths = { path = "../../foundation/kerf-paths" }
kerf-runtime = { path = "../../surfaces/kerf-runtime" }
kerf-scopes = { path = "../../color/kerf-scopes" }
kerf-skills = { path = "../../surfaces/kerf-skills" }
# A shot's graph and the workflow behind its model, as the editor shows and sets them.
kerf-shots = { path = "../../surfaces/kerf-shots" }
kerf-track = { path = "../../vfx/kerf-track" }
kerf-text = { path = "../../foundation/kerf-text" }
libc.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
# A take's record, written by hand as a recipe's making wrote one.
hex.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
