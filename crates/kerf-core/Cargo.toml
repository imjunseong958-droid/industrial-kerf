[package]
name = "kerf-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lightweight, deterministic timeline and filtergraph primitives for Kerf"

[lib]
name = "kerf_core"
path = "src/lib.rs"

[dependencies]
kerf-model = { path = "../kerf-model" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
kerf-lang = { path = "../kerf-lang" }
