[package]
name = "kerf-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kerf's drawing on the GPU: pictures in textures, and the kernels that composite them"

# The kernels are carried from FilmCraft's GPU compositor (see licenses/README.md).
[dependencies]
kerf-draw = { path = "../kerf-draw" }
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = ["wgsl", "metal", "vulkan", "dx12"] }

[lints]
workspace = true
