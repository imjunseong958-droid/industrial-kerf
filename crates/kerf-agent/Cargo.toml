[package]
name = "kerf-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native Rust agent session with OpenAI and Anthropic adapters"

[dependencies]
base64 = "0.23"
kerf-runtime = { path = "../kerf-runtime" }
kerf-skills = { path = "../kerf-skills" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
